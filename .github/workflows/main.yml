name: Build the mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Make gradlew runnable
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-assembly-jar
          path: build/libs/*.jar
